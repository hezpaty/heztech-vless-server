worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # ECS Fargate embedded DNS resolver
    resolver 127.0.0.11 ipv6=off;

    # Internal Node app
    upstream vless_app {
        server 127.0.0.1:8081;
    }

    # WebSocket upgrade map (required for VLESS WS)
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080 ssl;
        http2 on;
        server_name hezpaty.hezz.dpdns.org;

        # Let's Encrypt cert (managed by certbot in entrypoint.sh)
        ssl_certificate     /etc/letsencrypt/live/hezpaty.hezz.dpdns.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/hezpaty.hezz.dpdns.org/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        # Main VLESS WS endpoint
        location / {
            proxy_pass http://vless_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_buffering off;
        }

        # ALB health check endpoint
        location /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }
    }
}
